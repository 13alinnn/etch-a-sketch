<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Etch-a-Sketch</title>
    <link href='./styles.css' rel='stylesheet'>
    <script src='./script.js' defer></script>
</head>
<body>
    <header><h1>Etch-a-Sketch</h1></header>
    <h3>Color picker</h3>
    <div class="color-picker">
        <div class="colorbox red"></div>
        <div class="colorbox green"></div>
        <div class="colorbox blue"></div>
        <div class="colorbox yellow"></div>
        <div class="colorbox black"></div>
        <div class="colorbox select"></div>
    </div>
    <div class='header'>
        <div class='slide'>
            <label for='slider'>Number of pixels</label>
            <div class='slider'>
                <button id='minus'>-</button>
                <input type='range' id='slider' min='10' max='64' step='1' value='20'>
                <button id='plus'>+</button>
            </div>
            <p class='sliderValue'></p>
        </div>
    </div>
    <div id='container'></div>
    <button id='clear'>Clear</button>
</body>
</html>
